<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hader</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<style>
  :root { --accent: #4338CA; --accent-soft: #E0E7FF; }
  @media (prefers-color-scheme: dark) { :root { --accent: #A5B4FC; --accent-ink: #1E1B4B; --accent-soft: #272463; } }
  .people { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
  .person { display: grid; gap: 4px; padding: 14px; }
  .person .row { justify-content: space-between; }
  .slip { max-width: 720px; }
  td.num { white-space: nowrap; }
  .slip table td.num { text-align: end; }
  .qrbox { display: grid; justify-items: center; gap: 8px; text-align: center; }
  .qrbox img { width: 220px; height: 220px; background: #fff; padding: 8px; border-radius: 12px; border: 1px solid var(--line); }
  dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); max-width: min(92vw, 760px); }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  .days input { accent-color: var(--accent); }
  @media print { .rail, .mobile-nav, .no-print { display: none !important; } .shell { display: block; } dialog { position: static; border: 0; max-width: none; } body > :not(dialog) { display: none; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script src="app.js"></script>
<script src="demo.js"></script>
</body>
</html>
